<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#020818">
<title>The System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue: #38bdf8;
  --blue-dim: rgba(14,165,233,0.2);
  --blue-glow: rgba(56,189,248,0.4);
  --purple: #818cf8;
  --dark: #020818;
  --panel: rgba(2,12,40,0.85);
  --border: rgba(56,189,248,0.3);
  --border-bright: rgba(56,189,248,0.65);
}
html, body {
  min-height: 100%; width: 100%;
  background: #020818;
  color: #e0f2fe;
  font-family: 'Rajdhani', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body {
  background:
    radial-gradient(ellipse at 15% 40%, #050e2a 0%, transparent 60%),
    radial-gradient(ellipse at 85% 15%, #0d0825 0%, transparent 50%),
    #020818;
  min-height: 100vh;
  padding-bottom: 60px;
}
.scanline {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px,
    rgba(56,189,248,0.015) 3px, rgba(56,189,248,0.015) 4px);
}

/* === HEADER === */
.header {
  background: rgba(2,8,28,0.92);
  border-bottom: 1px solid rgba(56,189,248,0.2);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: 14px 16px 0;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 4px 30px rgba(56,189,248,0.06);
}
.header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.brand-name {
  font-size: 22px; font-weight: 700; letter-spacing: 6px;
  color: var(--blue); text-shadow: 0 0 20px #38bdf8, 0 0 40px rgba(56,189,248,0.4);
}
.brand-sub { font-size: 10px; letter-spacing: 4px; color: rgba(14,165,233,0.6); margin-top: 2px; }
.level-display { text-align: right; }
.level-title { font-size: 11px; letter-spacing: 2px; color: rgba(56,189,248,0.65); }
.level-num {
  font-size: 26px; font-weight: 700; color: #7dd3fc;
  text-shadow: 0 0 16px #38bdf8;
}
.xp-bar-label { display: flex; justify-content: space-between; font-size: 11px; color: rgba(56,189,248,0.5); letter-spacing: 1px; margin-bottom: 4px; }
.xp-bar-track {
  height: 6px; background: rgba(56,189,248,0.06);
  border: 1px solid rgba(56,189,248,0.18); border-radius: 2px; overflow: hidden; margin-bottom: 12px;
}
.xp-bar-fill {
  height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, #0369a1, #38bdf8);
  box-shadow: 0 0 10px #38bdf8, 0 0 3px #fff;
  transition: width 0.7s cubic-bezier(0.4,0,0.2,1);
}
.tabs { display: flex; }
.tab {
  background: transparent; border: none; border-bottom: 2px solid transparent;
  color: rgba(56,189,248,0.4); padding: 8px 14px;
  font-family: inherit; font-size: 13px; font-weight: 600;
  letter-spacing: 1px; cursor: pointer; text-transform: uppercase; transition: all 0.2s;
}
.tab.active { color: var(--blue); border-bottom-color: var(--blue); }
.tab:hover:not(.active) { color: rgba(56,189,248,0.7); }

/* === PANELS === */
.main { padding: 16px 14px; max-width: 600px; margin: 0 auto; position: relative; z-index: 1; }
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  position: relative;
  margin-bottom: 12px;
  padding: 16px;
}
.panel.bright { border-color: var(--border-bright); box-shadow: 0 0 24px rgba(56,189,248,0.12); }
.panel::before, .panel::after,
.panel .corner-br::before, .panel .corner-br::after {
  content: ''; position: absolute; width: 10px; height: 10px;
  border-color: var(--blue); border-style: solid; pointer-events: none;
}
.panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
.panel::after  { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
.panel .corner-br::before { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
.panel .corner-br::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
.sl-label { font-size: 10px; letter-spacing: 3px; color: rgba(56,189,248,0.55); font-weight: 600; text-transform: uppercase; }

/* === STAT CARDS === */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat-card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
  padding: 12px 8px; text-align: center; position: relative;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.stat-card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
.stat-card::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
.stat-card::before, .stat-card::after {
  content: ''; position: absolute; width: 8px; height: 8px; border-color: var(--blue); border-style: solid;
}
.stat-val { font-size: 20px; font-weight: 700; margin-top: 4px; }

/* === ATTRIBUTES === */
.attr-row { display: flex; flex-direction: column; gap: 14px; }
.attr-item { display: flex; flex-direction: column; gap: 5px; }
.attr-top { display: flex; align-items: center; gap: 8px; }
.attr-icon { font-size: 15px; }
.attr-name { font-size: 14px; font-weight: 700; letter-spacing: 1px; flex: 1; }
.attr-desc { font-size: 10px; color: rgba(56,189,248,0.45); }
.attr-lv { font-size: 12px; font-weight: 700; min-width: 40px; text-align: right; }
.attr-bottom { display: flex; align-items: center; gap: 8px; }
.bar-track {
  height: 8px; flex: 1; background: rgba(56,189,248,0.06);
  border: 1px solid rgba(56,189,248,0.18); border-radius: 2px; overflow: hidden;
}
.bar-fill {
  height: 100%; border-radius: 2px; transition: width 0.7s cubic-bezier(0.4,0,0.2,1);
  position: relative;
}
.bar-fill::after {
  content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 4px;
  background: rgba(255,255,255,0.6); border-radius: 2px; filter: blur(2px);
}
.bar-xp { font-size: 10px; color: rgba(56,189,248,0.45); min-width: 64px; text-align: right; }

/* === DISTRIBUTION === */
.dist-bars { display: flex; height: 72px; align-items: flex-end; gap: 8px; }
.dist-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.dist-pct { font-size: 9px; color: rgba(56,189,248,0.45); }
.dist-bar { width: 100%; border-radius: 2px 2px 0 0; transition: height 0.6s ease; }
.dist-icon { font-size: 13px; }

/* === FORM === */
.form-field { margin-bottom: 14px; }
.form-label { display: block; font-size: 10px; letter-spacing: 3px; color: rgba(56,189,248,0.55); font-weight: 600; text-transform: uppercase; margin-bottom: 6px; }
.sl-input {
  width: 100%; padding: 11px 14px;
  background: rgba(2,12,40,0.9); border: 1px solid var(--border); border-radius: 4px;
  color: #e0f2fe; font-family: inherit; font-size: 15px; outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  -webkit-appearance: none;
}
.sl-input:focus { border-color: var(--blue); box-shadow: 0 0 12px rgba(56,189,248,0.2); }
select.sl-input option { background: #020c28; color: #e0f2fe; }
.xp-preview {
  background: rgba(56,189,248,0.05); border: 1px solid rgba(56,189,248,0.22);
  border-radius: 4px; padding: 10px 14px; margin-bottom: 16px;
  display: flex; justify-content: space-between; align-items: center;
}
.xp-preview-val { font-size: 20px; font-weight: 700; }
.xp-preview-attr { font-size: 12px; color: rgba(56,189,248,0.5); margin-left: 8px; }
.btn-primary {
  width: 100%; padding: 14px; background: rgba(56,189,248,0.08);
  border: 1px solid var(--blue); border-radius: 4px;
  color: var(--blue); font-family: inherit; font-size: 15px;
  font-weight: 700; letter-spacing: 3px; cursor: pointer; text-transform: uppercase;
  transition: all 0.2s;
}
.btn-primary:hover, .btn-primary:active { background: rgba(56,189,248,0.18); box-shadow: 0 0 24px rgba(56,189,248,0.3); }
.btn-danger {
  width: 100%; padding: 13px; background: rgba(239,68,68,0.07);
  border: 1px solid rgba(239,68,68,0.45); border-radius: 4px;
  color: #fca5a5; font-family: inherit; font-size: 14px;
  font-weight: 700; letter-spacing: 2px; cursor: pointer; text-transform: uppercase;
  transition: all 0.2s;
}
.btn-danger:hover, .btn-danger:active { background: rgba(239,68,68,0.15); box-shadow: 0 0 20px rgba(239,68,68,0.2); }

/* === LOG === */
.log-entry { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(56,189,248,0.1); }
.log-entry:last-child { border-bottom: none; }
.log-icon {
  width: 34px; height: 34px; border-radius: 4px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.log-body { flex: 1; min-width: 0; }
.log-name { font-size: 14px; font-weight: 600; color: #e0f2fe; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-meta { font-size: 11px; color: rgba(56,189,248,0.45); letter-spacing: 1px; margin-top: 2px; }
.log-xp { font-size: 15px; font-weight: 700; flex-shrink: 0; }
.log-empty { text-align: center; color: rgba(56,189,248,0.3); padding: 32px 0; font-size: 14px; letter-spacing: 2px; }

/* === FLASH === */
.flash {
  position: fixed; top: 76px; left: 50%; transform: translateX(-50%);
  padding: 10px 24px; border-radius: 4px;
  font-family: inherit; font-weight: 700; font-size: 15px;
  letter-spacing: 2px; z-index: 999; pointer-events: none;
  white-space: nowrap; animation: flashIn 0.3s ease;
}
@keyframes flashIn { from { opacity:0; transform:translateX(-50%) translateY(-10px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
.flash.pos { background:rgba(2,20,60,0.95); border:1px solid #38bdf8; color:#7dd3fc; box-shadow:0 0 30px rgba(56,189,248,0.4); }
.flash.neg { background:rgba(40,4,4,0.95); border:1px solid #ef4444; color:#fca5a5; box-shadow:0 0 30px rgba(239,68,68,0.35); }
.divider { height:1px; background:linear-gradient(90deg,transparent,rgba(56,189,248,0.3),transparent); margin:12px 0; }

/* === MOBILE === */
@media (max-width: 480px) {
  .brand-name { font-size: 18px; letter-spacing: 4px; }
  .level-num { font-size: 22px; }
  .stat-grid { grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .stat-val { font-size: 17px; }
  .main { padding: 12px 10px; }
  .tab { font-size: 12px; padding: 8px 10px; letter-spacing: 0; }
  .flash { font-size: 13px; max-width: 90vw; white-space: normal; text-align: center; top: 70px; }
}
</style>
</head>
<body>
<div class="scanline"></div>

<!-- FLASH MESSAGE -->
<div id="flash" class="flash pos" style="display:none"></div>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div>
      <div class="brand-name">THE SYSTEM</div>
      <div class="brand-sub">AWAKENING PROTOCOL ACTIVE</div>
    </div>
    <div class="level-display">
      <div class="level-title" id="rank-title">E-Rank Hunter</div>
      <div class="level-num">LVL <span id="lvl-num">1</span></div>
    </div>
  </div>
  <div class="xp-bar-label">
    <span>EXPERIENCE</span><span id="xp-label">0 / 100 XP</span>
  </div>
  <div class="xp-bar-track"><div class="xp-bar-fill" id="xp-bar" style="width:0%"></div></div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('dashboard')">Status</button>
    <button class="tab" onclick="switchTab('quest')">Log Quest</button>
    <button class="tab" onclick="switchTab('log')">Quest Log</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- DASHBOARD -->
  <div id="tab-dashboard">
    <div class="stat-grid">
      <div class="stat-card"><div class="sl-label">Total XP</div><div class="stat-val" id="s-totalxp" style="color:#38bdf8;text-shadow:0 0 10px #38bdf8">0</div></div>
      <div class="stat-card"><div class="sl-label">Level</div><div class="stat-val" id="s-level" style="color:#a78bfa;text-shadow:0 0 10px #a78bfa">1</div></div>
      <div class="stat-card"><div class="sl-label">Quests</div><div class="stat-val" id="s-quests" style="color:#34d399;text-shadow:0 0 10px #34d399">0</div></div>
    </div>

    <div class="panel bright">
      <div class="corner-br"></div>
      <div class="sl-label" style="margin-bottom:14px">Core Attributes</div>
      <div class="attr-row" id="attr-rows"></div>
    </div>

    <div class="panel">
      <div class="corner-br"></div>
      <div class="sl-label" style="margin-bottom:12px">Attribute Distribution</div>
      <div class="dist-bars" id="dist-bars"></div>
    </div>

    <button class="btn-danger" id="doom-btn" onclick="doomscroll()">
      ⚠ DOOMSCROLL PENALTY — -<span id="doom-xp">15</span> XP
    </button>
  </div>

  <!-- QUEST INPUT -->
  <div id="tab-quest" style="display:none">
    <div class="panel bright">
      <div class="corner-br"></div>
      <div class="sl-label" style="margin-bottom:18px">Log Completed Quest</div>
      <div class="form-field">
        <label class="form-label">Activity Name</label>
        <input class="sl-input" id="f-name" type="text" placeholder="e.g. Morning run, Read 30 pages..." autocomplete="off">
      </div>
      <div class="form-field">
        <label class="form-label">Duration (minutes)</label>
        <input class="sl-input" id="f-duration" type="number" min="1" placeholder="30" inputmode="numeric">
      </div>
      <div class="form-field">
        <label class="form-label">Category</label>
        <select class="sl-input" id="f-category" onchange="updatePreview()"></select>
      </div>
      <div class="xp-preview" id="xp-preview" style="display:none">
        <span class="sl-label">Estimated Reward</span>
        <div>
          <span class="xp-preview-val" id="preview-val">+0 XP</span>
          <span class="xp-preview-attr" id="preview-attr"></span>
        </div>
      </div>
      <button class="btn-primary" onclick="submitQuest()">Complete Quest</button>
    </div>
  </div>

  <!-- LOG -->
  <div id="tab-log" style="display:none">
    <div class="panel">
      <div class="corner-br"></div>
      <div class="sl-label" style="margin-bottom:14px">Quest History</div>
      <div id="log-list"></div>
    </div>
  </div>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
const ATTRS = [
  { key:'strength',     label:'Strength',     icon:'⚡', color:'#38bdf8', desc:'Physical' },
  { key:'intelligence', label:'Intelligence',  icon:'◈',  color:'#818cf8', desc:'Learning' },
  { key:'charisma',     label:'Charisma',      icon:'◉',  color:'#34d399', desc:'Social' },
  { key:'willpower',    label:'Willpower',     icon:'◆',  color:'#a78bfa', desc:'Focus' },
  { key:'agility',      label:'Agility',       icon:'▶',  color:'#22d3ee', desc:'Speed' },
];
const CATS = [
  { label:'Physical Training',        attr:'strength',     intensity:1.5 },
  { label:'Running / Cardio',         attr:'strength',     intensity:1.4 },
  { label:'Reading / Study',          attr:'intelligence', intensity:1.3 },
  { label:'Coding / Problem Solving', attr:'intelligence', intensity:1.5 },
  { label:'Chess / Strategy',         attr:'intelligence', intensity:1.2 },
  { label:'Social / Networking',      attr:'charisma',     intensity:1.1 },
  { label:'Public Speaking',          attr:'charisma',     intensity:1.4 },
  { label:'Deep Work / Focus',        attr:'willpower',    intensity:1.6 },
  { label:'Meditation',               attr:'willpower',    intensity:1.3 },
  { label:'Journaling',               attr:'willpower',    intensity:1.1 },
  { label:'Speed Drills',             attr:'agility',      intensity:1.3 },
  { label:'Habit Tracking',           attr:'agility',      intensity:1.0 },
];
const RANKS = [
  [1,'E-Rank Hunter'],[5,'D-Rank Hunter'],[10,'C-Rank Hunter'],[15,'B-Rank Hunter'],
  [20,'A-Rank Hunter'],[30,'S-Rank Hunter'],[50,'National-Level Hunter'],
  [75,'Shadow Monarch'],[100,'Absolute Being'],
];

function getRank(lvl) { let t=RANKS[0][1]; for(const [l,n] of RANKS){if(lvl>=l)t=n;} return t; }
function xpForLevel(lvl) { return Math.round(100 * Math.pow(1.1, lvl-1)); }
function resolveLevel(totalXP) {
  let lvl=1, spent=0;
  while(true){ const need=xpForLevel(lvl); if(spent+need>totalXP) break; spent+=need; lvl++; }
  return { level:lvl, currentXP:totalXP-spent, neededXP:xpForLevel(lvl) };
}

// ─── STATE ───────────────────────────────────────────────────────────────────
const DEF = { totalXP:0, attrs:{strength:0,intelligence:0,charisma:0,willpower:0,agility:0}, log:[] };
let state = DEF;
function load() { try { const r=localStorage.getItem('the_system_v3'); if(r) state=JSON.parse(r); } catch{} }
function save() { try { localStorage.setItem('the_system_v3', JSON.stringify(state)); } catch{} }

// ─── XP / LEVEL LOGIC ────────────────────────────────────────────────────────
function addXP(xp, attrKey, label) {
  const prevLevel = resolveLevel(state.totalXP).level;
  state.totalXP = Math.max(0, state.totalXP + xp);
  state.attrs[attrKey] = Math.max(0, (state.attrs[attrKey]||0) + xp);
  state.log.unshift({ id:Date.now(), label, xp, attr:attrKey, ts:new Date().toLocaleString() });
  if (state.log.length > 50) state.log.pop();
  save();
  const newLevel = resolveLevel(state.totalXP).level;
  if (newLevel > prevLevel) showFlash(`LEVEL UP!  Level ${newLevel}  ·  ${getRank(newLevel)}`, true);
  else showFlash(xp>=0 ? `+ ${Math.round(xp)} XP  ·  ${label}` : `${Math.round(xp)} XP  ·  ${label}`, xp>=0);
  render();
}

// ─── FLASH ───────────────────────────────────────────────────────────────────
let flashTimer = null;
function showFlash(msg, pos=true) {
  const el = document.getElementById('flash');
  el.textContent = msg;
  el.className = 'flash ' + (pos ? 'pos' : 'neg');
  el.style.display = 'block';
  if (flashTimer) clearTimeout(flashTimer);
  flashTimer = setTimeout(() => el.style.display='none', 2200);
}

// ─── TABS ────────────────────────────────────────────────────────────────────
let currentTab = 'dashboard';
function switchTab(tab) {
  ['dashboard','quest','log'].forEach(t => {
    document.getElementById('tab-'+t).style.display = t===tab ? 'block' : 'none';
  });
  document.querySelectorAll('.tab').forEach((el,i) => {
    el.classList.toggle('active', ['dashboard','quest','log'][i]===tab);
  });
  currentTab = tab;
  if (tab==='quest') updatePreview();
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const { level, currentXP, neededXP } = resolveLevel(state.totalXP);
  const pct = Math.min(100, neededXP>0 ? (currentXP/neededXP)*100 : 0);

  document.getElementById('lvl-num').textContent = level;
  document.getElementById('rank-title').textContent = getRank(level);
  document.getElementById('xp-label').textContent = `${currentXP} / ${neededXP} XP`;
  document.getElementById('xp-bar').style.width = pct + '%';
  document.getElementById('s-totalxp').textContent = state.totalXP.toLocaleString();
  document.getElementById('s-level').textContent = level;
  document.getElementById('s-quests').textContent = state.log.filter(l=>l.xp>0).length;

  const pen = Math.round(xpForLevel(level)*0.15);
  document.getElementById('doom-xp').textContent = pen;

  // Attr rows
  const totalAXP = Object.values(state.attrs).reduce((a,b)=>a+b,0)||1;
  const attrRows = document.getElementById('attr-rows');
  attrRows.innerHTML = '';
  ATTRS.forEach(a => {
    const aXP = state.attrs[a.key]||0;
    const { level:aLvl, currentXP:aCur, neededXP:aNeed } = resolveLevel(aXP);
    const apct = Math.min(100, aNeed>0?(aCur/aNeed)*100:0);
    attrRows.innerHTML += `
      <div class="attr-item">
        <div class="attr-top">
          <span class="attr-icon" style="color:${a.color};filter:drop-shadow(0 0 4px ${a.color})">${a.icon}</span>
          <span class="attr-name">${a.label}</span>
          <span class="attr-desc">${a.desc}</span>
          <span class="attr-lv" style="color:${a.color};text-shadow:0 0 8px ${a.color}">LV ${aLvl}</span>
        </div>
        <div class="attr-bottom">
          <div class="bar-track">
            <div class="bar-fill" style="width:${apct}%;background:${a.color};box-shadow:0 0 10px ${a.color}88"></div>
          </div>
          <span class="bar-xp">${aCur}/${aNeed}</span>
        </div>
      </div>`;
  });

  // Distribution bars
  const distEl = document.getElementById('dist-bars');
  distEl.innerHTML = '';
  ATTRS.forEach(a => {
    const share = (state.attrs[a.key]||0)/totalAXP;
    const h = Math.max(6, share*62);
    distEl.innerHTML += `
      <div class="dist-bar-wrap">
        <div class="dist-pct">${Math.round(share*100)}%</div>
        <div class="dist-bar" style="height:${h}px;background:${a.color};box-shadow:0 0 12px ${a.color}88"></div>
        <div class="dist-icon" style="color:${a.color};filter:drop-shadow(0 0 4px ${a.color})">${a.icon}</div>
      </div>`;
  });

  // Log
  const logEl = document.getElementById('log-list');
  if (state.log.length===0) {
    logEl.innerHTML = '<div class="log-empty">NO RECORDS FOUND</div>';
  } else {
    logEl.innerHTML = state.log.map(entry => {
      const attr = ATTRS.find(a=>a.key===entry.attr);
      const pos = entry.xp >= 0;
      const iconStyle = pos
        ? `background:${attr?.color}22;border:1px solid ${attr?.color}44`
        : `background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3)`;
      const xpStyle = pos
        ? `color:${attr?.color};text-shadow:0 0 10px ${attr?.color}`
        : `color:#f87171;text-shadow:0 0 10px rgba(248,113,113,0.5)`;
      return `
        <div class="log-entry">
          <div class="log-icon" style="${iconStyle}">${pos?(attr?.icon||'◈'):'✕'}</div>
          <div class="log-body">
            <div class="log-name">${entry.label}</div>
            <div class="log-meta">${entry.ts} · ${attr?.label||''}</div>
          </div>
          <div class="log-xp" style="${xpStyle}">${pos?'+':''}${entry.xp} XP</div>
        </div>`;
    }).join('');
  }
}

// ─── QUEST FORM ──────────────────────────────────────────────────────────────
function buildCategorySelect() {
  const sel = document.getElementById('f-category');
  sel.innerHTML = CATS.map(c => {
    const attr = ATTRS.find(a=>a.key===c.attr);
    return `<option value="${c.label}">${c.label} (${attr?.label})</option>`;
  }).join('');
}

function updatePreview() {
  const dur = parseFloat(document.getElementById('f-duration').value);
  const catLabel = document.getElementById('f-category').value;
  const preview = document.getElementById('xp-preview');
  if (!dur || dur<=0) { preview.style.display='none'; return; }
  const cat = CATS.find(c=>c.label===catLabel);
  const { level } = resolveLevel(state.totalXP);
  const xp = Math.max(1, Math.round((dur*cat.intensity)/(level/5)));
  const attr = ATTRS.find(a=>a.key===cat.attr);
  document.getElementById('preview-val').textContent = `+${xp} XP`;
  document.getElementById('preview-val').style.color = attr?.color;
  document.getElementById('preview-val').style.textShadow = `0 0 10px ${attr?.color}`;
  document.getElementById('preview-attr').textContent = `→ ${attr?.label}`;
  preview.style.display = 'flex';
}

function submitQuest() {
  const name = document.getElementById('f-name').value.trim();
  const dur = parseFloat(document.getElementById('f-duration').value);
  if (!name || !dur || dur<=0) { showFlash('Fill in all fields!', false); return; }
  const catLabel = document.getElementById('f-category').value;
  const cat = CATS.find(c=>c.label===catLabel);
  const { level } = resolveLevel(state.totalXP);
  const xp = Math.max(1, Math.round((dur*cat.intensity)/(level/5)));
  addXP(xp, cat.attr, name);
  document.getElementById('f-name').value = '';
  document.getElementById('f-duration').value = '';
  document.getElementById('xp-preview').style.display = 'none';
  switchTab('dashboard');
}

function doomscroll() {
  const { level } = resolveLevel(state.totalXP);
  const pen = Math.round(xpForLevel(level)*0.15);
  addXP(-pen, 'willpower', 'Doomscrolling Penalty');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
document.getElementById('f-duration').addEventListener('input', updatePreview);
load();
buildCategorySelect();
render();
</script>
</body>
</html>
