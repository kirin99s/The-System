<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#020818">
<title>The System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ac: #38bdf8; }
  html, body { background: #020818; color: #e0f2fe; font-family: 'Rajdhani', system-ui, sans-serif; min-height: 100vh; overflow-x: hidden; }
  body { background: radial-gradient(ellipse at 15% 40%, #050e2a, transparent 60%), radial-gradient(ellipse at 85% 15%, #0d0825, transparent 50%), #020818; padding-bottom: 60px; }
  .scanline { position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(56,189,248,0.012) 3px, rgba(56,189,248,0.012) 4px); z-index: 0; }
  /* scrollbar hide */
  .tabs-row { display: flex; overflow-x: auto; scrollbar-width: none; }
  .tabs-row::-webkit-scrollbar { display: none; }
  /* panel corners */
  .panel { background: rgba(2,12,40,0.88); border: 1px solid rgba(56,189,248,0.26); border-radius: 4px; backdrop-filter: blur(12px); position: relative; margin-bottom: 10px; padding: 13px; }
  .panel.hi { border-color: rgba(56,189,248,0.6); box-shadow: 0 0 20px rgba(56,189,248,0.09); }
  .panel::before, .panel::after { content: ''; position: absolute; width: 9px; height: 9px; border-color: var(--ac); border-style: solid; pointer-events: none; }
  .panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .panel::after  { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .crn::before, .crn::after { content: ''; position: absolute; width: 9px; height: 9px; border-color: var(--ac); border-style: solid; pointer-events: none; }
  .crn::before { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  .crn::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
  /* bars */
  .bar-track { height: 7px; flex: 1; background: rgba(56,189,248,0.06); border: 1px solid rgba(56,189,248,0.14); border-radius: 2px; overflow: hidden; }
  .bar-fill   { height: 100%; border-radius: 2px; transition: width .7s cubic-bezier(.4,0,.2,1); }
  /* xp bar */
  .xp-track { height: 5px; background: rgba(56,189,248,0.06); border: 1px solid rgba(56,189,248,0.14); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
  .xp-fill  { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #0369a1, var(--ac)); box-shadow: 0 0 8px var(--ac); transition: width .7s cubic-bezier(.4,0,.2,1); }
  /* inputs */
  .sl-input, .sl-ta { width: 100%; padding: 10px 12px; background: rgba(2,12,40,0.92); border: 1px solid rgba(56,189,248,0.26); border-radius: 4px; color: #e0f2fe; font-family: inherit; font-size: 15px; outline: none; transition: border-color .2s; }
  .sl-input:focus, .sl-ta:focus { border-color: var(--ac); box-shadow: 0 0 10px rgba(56,189,248,0.16); }
  .sl-ta { resize: none; line-height: 1.6; }
  select.sl-input option { background: #020c28; color: #e0f2fe; }
  /* buttons */
  .btn-p { width: 100%; padding: 12px; background: rgba(56,189,248,0.07); border: 1px solid var(--ac); border-radius: 4px; color: var(--ac); font-family: inherit; font-size: 14px; font-weight: 700; letter-spacing: 3px; cursor: pointer; text-transform: uppercase; transition: all .2s; }
  .btn-p:hover { background: rgba(56,189,248,0.16); box-shadow: 0 0 18px rgba(56,189,248,0.26); }
  .btn-p:disabled { opacity: .4; cursor: not-allowed; }
  .btn-d { width: 100%; padding: 11px; background: rgba(239,68,68,0.07); border: 1px solid rgba(239,68,68,0.4); border-radius: 4px; color: #fca5a5; font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; transition: all .2s; margin-bottom: 7px; }
  .btn-d:hover { background: rgba(239,68,68,0.14); }
  .btn-sm { padding: 12px; background: rgba(56,189,248,0.04); border: 1px solid rgba(56,189,248,0.22); border-radius: 4px; color: rgba(56,189,248,0.55); font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; flex: 1; }
  /* flash */
  .flash { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); padding: 9px 20px; border-radius: 4px; font-family: inherit; font-weight: 700; font-size: 13px; letter-spacing: 2px; z-index: 999; pointer-events: none; animation: fi .3s ease; max-width: 92vw; text-align: center; white-space: nowrap; }
  @keyframes fi { from { opacity:0; transform:translateX(-50%) translateY(-10px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
  .fp  { background: rgba(2,20,60,0.97);  border: 1px solid var(--ac);    color: #7dd3fc; box-shadow: 0 0 24px rgba(56,189,248,0.35); }
  .fn  { background: rgba(40,4,4,0.97);   border: 1px solid #ef4444;      color: #fca5a5; box-shadow: 0 0 24px rgba(239,68,68,0.3); }
  .fl  { background: rgba(10,2,40,0.97);  border: 1px solid #f0abfc;      color: #f5d0fe; box-shadow: 0 0 24px rgba(240,171,252,0.38); }
  .flv { background: rgba(10,2,40,0.97);  border: 1px solid #a78bfa;      color: #c4b5fd; box-shadow: 0 0 24px rgba(167,139,250,0.4); }
  /* lbl */
  .lbl { font-size: 10px; letter-spacing: 3px; color: rgba(56,189,248,0.48); font-weight: 600; text-transform: uppercase; }
  /* stat card corners */
  .stat-c { background: rgba(2,12,40,0.88); border: 1px solid rgba(56,189,248,0.26); border-radius: 4px; padding: 9px 6px; text-align: center; position: relative; }
  .stat-c::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .stat-c::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
  .stat-c::before, .stat-c::after { content: ''; position: absolute; width: 7px; height: 7px; border-color: var(--ac); border-style: solid; }
  /* lore */
  .lore-card { background: rgba(240,171,252,0.04); border: 1px solid rgba(240,171,252,0.18); border-radius: 4px; padding: 13px; margin-bottom: 9px; position: relative; overflow: hidden; }
  .lore-card.locked { opacity: .32; filter: blur(0.4px); }
  .lore-card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: linear-gradient(180deg, #a78bfa, #f0abfc); }
  /* thinking dots */
  .td { width: 7px; height: 7px; border-radius: 50%; background: var(--ac); display: inline-block; margin-right: 4px; animation: pu 1.4s ease-in-out infinite; }
  .td:nth-child(2) { animation-delay: .2s; }
  .td:nth-child(3) { animation-delay: .4s; }
  @keyframes pu { 0%,100%{opacity:.35;transform:scale(.8)} 50%{opacity:1;transform:scale(1)} }
  /* decay dot */
  .dd { width: 7px; height: 7px; border-radius: 50%; background: #fbbf24; box-shadow: 0 0 5px #fbbf24; flex-shrink: 0; animation: pu 1.8s ease-in-out infinite; }
  /* onboarding */
  .ob-card { background: rgba(2,12,40,0.92); border: 1px solid rgba(56,189,248,0.33); border-radius: 8px; padding: 26px 20px; max-width: 480px; width: 100%; box-shadow: 0 0 38px rgba(56,189,248,0.09); }
  .arch-c { background: rgba(2,12,40,0.8); border: 1px solid rgba(56,189,248,0.23); border-radius: 4px; padding: 11px; cursor: pointer; transition: all .2s; }
  .arch-c.sel { border-color: #38bdf8; background: rgba(56,189,248,0.09); box-shadow: 0 0 14px rgba(56,189,248,0.18); }
  .goal-c { background: rgba(2,12,40,0.8); border: 1px solid rgba(56,189,248,0.2); border-radius: 4px; padding: 9px 11px; cursor: pointer; transition: all .2s; font-size: 13px; font-weight: 600; color: rgba(56,189,248,0.65); }
  .goal-c.sel { border-color: #38bdf8; background: rgba(56,189,248,0.09); color: #38bdf8; }
  .habit-c { padding: 4px 11px; border-radius: 20px; border: 1px solid rgba(239,68,68,0.33); background: rgba(239,68,68,0.07); color: #fca5a5; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s; }
  .habit-c.sel { border-color: #ef4444; background: rgba(239,68,68,0.18); }
  .pdot { width: 8px; height: 8px; border-radius: 50%; background: rgba(56,189,248,0.18); transition: background .3s; }
  .pdot.on { background: #38bdf8; box-shadow: 0 0 7px #38bdf8; }
  .ep { padding: 8px 11px; background: rgba(56,189,248,0.04); border: 1px solid rgba(56,189,248,0.14); border-radius: 4px; font-size: 12px; color: rgba(56,189,248,0.52); cursor: pointer; transition: all .2s; line-height: 1.4; margin-bottom: 6px; }
  .ep:hover { border-color: rgba(56,189,248,0.38); color: rgba(56,189,248,0.82); background: rgba(56,189,248,0.08); }
  .chip { padding: 3px 9px; border-radius: 12px; font-size: 11px; font-weight: 600; letter-spacing: 1px; background: rgba(56,189,248,0.07); border: 1px solid rgba(56,189,248,0.23); color: rgba(56,189,248,0.72); }
  .note-box { background: rgba(56,189,248,0.04); border: 1px solid rgba(56,189,248,0.16); border-radius: 4px; padding: 9px 11px; font-size: 12px; color: rgba(56,189,248,0.58); line-height: 1.6; margin-top: 9px; }
  .mantra { font-size: 13px; font-style: italic; color: rgba(56,189,248,0.62); border-left: 2px solid rgba(56,189,248,0.28); padding: 7px 11px; margin-bottom: 10px; line-height: 1.5; }
  .icard { background: rgba(56,189,248,0.04); border: 1px solid rgba(56,189,248,0.18); border-radius: 4px; padding: 11px 13px; margin-bottom: 10px; }
  .stk-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; background: rgba(251,191,36,0.09); border: 1px solid rgba(251,191,36,0.33); border-radius: 20px; font-size: 12px; font-weight: 700; color: #fbbf24; letter-spacing: 1px; }
  .tbadge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: 700; letter-spacing: 2px; }
  .kbadge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; background: rgba(167,139,250,0.09); border: 1px solid rgba(167,139,250,0.28); border-radius: 12px; font-size: 10px; font-weight: 700; color: #a78bfa; letter-spacing: 1px; }
  .assess-card { background: rgba(2,12,40,0.95); border: 1px solid rgba(56,189,248,0.48); border-radius: 5px; padding: 15px; margin-bottom: 13px; box-shadow: 0 0 20px rgba(56,189,248,0.13); animation: fi .4s ease; }
  .log-entry { display: flex; align-items: center; gap: 9px; padding: 8px 0; border-bottom: 1px solid rgba(56,189,248,0.08); }
  .log-entry:last-child { border-bottom: none; }
  .lgc { background: rgba(2,12,40,0.68); border: 1px solid rgba(56,189,248,0.18); border-radius: 4px; padding: 11px 13px; margin-bottom: 7px; }
  .wi { padding: 10px 0; border-bottom: 1px solid rgba(56,189,248,0.09); display: flex; flex-direction: column; gap: 6px; }
  .wi:last-child { border-bottom: none; }
  .mi { padding: 9px 0; border-bottom: 1px solid rgba(56,189,248,0.09); display: flex; flex-direction: column; gap: 6px; }
  .mi:last-child { border-bottom: none; }
  @media (max-width: 420px) {
    .brand { font-size: 16px; letter-spacing: 3px; }
    .tab-btn { font-size: 11px; padding: 6px 8px; letter-spacing: 0; }
  }
</style>
</head>
<body>

<div class="scanline"></div>
<div id="flash" class="flash fp" style="display:none"></div>

<!-- ── ONBOARDING ──────────────────────────────────────────── -->
<div id="screen-onboard" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 14px;position:relative;z-index:1;">
  <div class="ob-card">
    <div style="font-size:22px;font-weight:700;letter-spacing:4px;color:#38bdf8;text-shadow:0 0 16px #38bdf8;margin-bottom:4px">THE SYSTEM</div>
    <div style="font-size:11px;letter-spacing:3px;color:rgba(56,189,248,0.48);margin-bottom:22px">AWAKENING PROTOCOL</div>
    <div id="prog-dots" style="display:flex;gap:5px;justify-content:center;margin-bottom:18px"></div>
    <div id="ob-content"></div>
  </div>
</div>

<!-- ── MAIN APP ────────────────────────────────────────────── -->
<div id="screen-app" style="display:none">
  <!-- Header -->
  <div id="hdr" style="background:rgba(2,8,28,0.93);border-bottom:1px solid rgba(56,189,248,0.18);backdrop-filter:blur(16px);padding:12px 14px 0;position:sticky;top:0;z-index:100;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px">
      <div>
        <div class="brand" style="font-size:19px;font-weight:700;letter-spacing:5px;color:var(--ac);text-shadow:0 0 18px var(--ac)">THE SYSTEM</div>
        <div id="hdr-sub" style="font-size:10px;letter-spacing:3px;color:rgba(14,165,233,0.5);margin-top:2px"></div>
      </div>
      <div style="text-align:right">
        <div id="hdr-rank" style="font-size:10px;letter-spacing:2px;color:rgba(56,189,248,0.55)"></div>
        <div id="hdr-lvl" style="font-size:23px;font-weight:700;color:#7dd3fc;text-shadow:0 0 14px var(--ac)">LVL 1</div>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:rgba(56,189,248,0.42);letter-spacing:1px;margin-bottom:4px">
      <span>EXPERIENCE</span><span id="xp-label">0 / 100 XP</span>
    </div>
    <div class="xp-track"><div id="xp-bar" class="xp-fill" style="width:0%"></div></div>
    <div class="tabs-row" id="tab-bar"></div>
  </div>

  <div style="padding:13px 11px;max-width:600px;margin:0 auto;position:relative;z-index:1" id="main-content"></div>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
const ARCHETYPES = [
  { key:'warrior',  label:'The Warrior',  icon:'⚔',  primary:['strength','agility'],      desc:'You build through sweat and discipline.' },
  { key:'scholar',  label:'The Scholar',  icon:'◈',  primary:['intelligence','willpower'],  desc:'You grow through knowledge and deep work.' },
  { key:'builder',  label:'The Builder',  icon:'◆',  primary:['willpower','intelligence'],  desc:'You create systems and make things real.' },
  { key:'connector',label:'The Connector',icon:'◉',  primary:['charisma','agility'],        desc:'You grow through people and momentum.' },
];
const GOALS = [
  { key:'fitness',    label:'Get Fit',            attr:'strength'     },
  { key:'career',     label:'Advance My Career',  attr:'intelligence' },
  { key:'learning',   label:'Learn Continuously', attr:'intelligence' },
  { key:'mental',     label:'Mental Clarity',     attr:'willpower'    },
  { key:'social',     label:'Build Relationships',attr:'charisma'     },
  { key:'consistency',label:'Build Consistency',  attr:'agility'      },
];
const ATTRS = [
  { key:'strength',     label:'Strength',    icon:'⚡', color:'#38bdf8', desc:'Physical' },
  { key:'intelligence', label:'Intelligence', icon:'◈',  color:'#818cf8', desc:'Learning' },
  { key:'charisma',     label:'Charisma',    icon:'◉',  color:'#34d399', desc:'Social'   },
  { key:'willpower',    label:'Willpower',   icon:'◆',  color:'#a78bfa', desc:'Focus'    },
  { key:'agility',      label:'Agility',     icon:'▶',  color:'#22d3ee', desc:'Speed'    },
];
const WQ_POOL = [
  { id:'wq1',label:'Log 3 Physical sessions',       attr:'strength',     target:3,   type:'count',    cat:'strength'     },
  { id:'wq2',label:'Accumulate 120 min of Study',   attr:'intelligence', target:120, type:'duration', cat:'intelligence' },
  { id:'wq3',label:'Complete 5 Focus sessions',     attr:'willpower',    target:5,   type:'count',    cat:'willpower'    },
  { id:'wq4',label:'Log 3 Social interactions',     attr:'charisma',     target:3,   type:'count',    cat:'charisma'     },
  { id:'wq5',label:'Train or run 4 times',          attr:'strength',     target:4,   type:'count',    cat:'strength'     },
  { id:'wq6',label:'Meditate or journal 5 times',   attr:'willpower',    target:5,   type:'count',    cat:'willpower'    },
  { id:'wq7',label:'Log 5 Intelligence activities', attr:'intelligence', target:5,   type:'count',    cat:'intelligence' },
  { id:'wq8',label:'Log 180 min of focused work',   attr:'willpower',    target:180, type:'duration', cat:'willpower'    },
  { id:'wq9',label:'Complete 4 Agility sessions',   attr:'agility',      target:4,   type:'count',    cat:'agility'      },
  { id:'wq10',label:'Log 5 Charisma sessions',      attr:'charisma',     target:5,   type:'count',    cat:'charisma'     },
];
const RANKS = {
  warrior:  [[1,'Recruit'],[5,'Soldier'],[10,'Knight'],[20,'Champion'],[30,'Warlord'],[50,'Legendary Warrior'],[75,'War God'],[100,'Eternal Conqueror']],
  scholar:  [[1,'Initiate'],[5,'Apprentice'],[10,'Adept'],[20,'Sage'],[30,'Archmage'],[50,'Grand Scholar'],[75,'Oracle'],[100,'Absolute Mind']],
  builder:  [[1,'Tinkerer'],[5,'Craftsman'],[10,'Engineer'],[20,'Architect'],[30,'Visionary'],[50,'Master Builder'],[75,'Legend Maker'],[100,'World Shaper']],
  connector:[[1,'Newcomer'],[5,'Networker'],[10,'Influencer'],[20,'Leader'],[30,'Charisma Lord'],[50,'Grand Diplomat'],[75,'Living Legend'],[100,'The Beloved']],
};
const LORE = {
  warrior:[
    {lvl:1, title:'The Awakening',       text:'You opened your eyes for the first time. The weight of untapped potential pressed against your chest. You did not know yet what you were capable of — but something in you stirred.'},
    {lvl:5, title:'First Blood',          text:'You have felt the burn of real effort. Not the comfortable kind — the kind that makes you question whether to continue. You continued. That is what separates you from who you were.'},
    {lvl:10,title:'The Discipline Forms', text:'Others see consistency as a burden. You have begun to feel it as identity. The morning no longer feels like an opponent. It feels like a signal.'},
    {lvl:20,title:'The Champion Emerges',text:'People around you have started to notice something has changed. You carry yourself differently. Not with arrogance — with quiet certainty.'},
    {lvl:30,title:"The Warlord's Code",  text:'Your habits are no longer things you do — they are things you are. The Warlord does not conquer others. The Warlord has conquered the version of themselves that used to make excuses.'},
    {lvl:50,title:'Legend in Progress',  text:'Few people ever reach this depth of commitment. You are no longer motivated by the numbers. You train because not training would feel like a betrayal of who you have become.'},
  ],
  scholar:[
    {lvl:1, title:'The First Question',  text:'You asked why. Most people never do. The path of the Scholar begins with discomfort — the discomfort of not knowing.'},
    {lvl:5, title:'The Habit of Inquiry',text:'You have begun to notice how your mind works differently now. Problems that once felt opaque have started revealing their edges.'},
    {lvl:10,title:"The Adept's Clarity", text:'Knowledge has begun to compound. Ideas from different domains are connecting in your mind without effort. This is what consistent learning does to a brain over time.'},
    {lvl:20,title:'The Sage Speaks',     text:'You have moved beyond consuming knowledge. You have started to synthesize it — to form your own positions and hold uncertainty without anxiety.'},
    {lvl:30,title:"The Archmage's Burden",text:'Depth is lonely. Few people around you will understand the things you now understand. Carry the knowledge well.'},
    {lvl:50,title:'The Grand Scholar',   text:'You have become a person who changes rooms when they enter them. Not through performance — through the quality of your thinking.'},
  ],
  builder:[
    {lvl:1, title:'The Blueprint',       text:'You saw something that did not exist yet and decided it should. That impulse — to make, to build, to solve — is not common. Most people consume. You create.'},
    {lvl:5, title:'The First System',    text:'You have learned that discipline is not willpower. It is architecture. You are beginning to build systems that make the right behavior the easy behavior.'},
    {lvl:10,title:"The Engineer's Eye",  text:'You now see inefficiency everywhere — not with frustration, but with curiosity. Every broken thing is an invitation.'},
    {lvl:20,title:'The Architect Rises', text:'Your work has started to outlast your effort. The systems you built are running without you. This is leverage — the Builder\'s greatest tool.'},
    {lvl:30,title:"The Visionary's Cost",text:'To build things that matter, you had to become someone who could see further than is comfortable.'},
    {lvl:50,title:'The Legend Maker',    text:"What you have built is no longer just yours. It has touched others. Changed things. The Builder's deepest satisfaction is watching someone else's life improve because of it."},
  ],
  connector:[
    {lvl:1, title:'The First Reach',     text:'You reached out when it would have been easier not to. That small act of courage — to be seen, to connect, to risk rejection — is where every meaningful relationship begins.'},
    {lvl:5, title:'The Energy Shift',    text:'You have noticed that some conversations leave you more alive than others. You are becoming more deliberate about which rooms you enter.'},
    {lvl:10,title:'The Influencer Wakes',text:'People have started coming to you. Not because you sought attention — because you gave it, consistently, to others.'},
    {lvl:20,title:"The Leader's Weight", text:'Leadership found you before you looked for it. It is not about being followed — it is about being responsible for the energy of every room you are in.'},
    {lvl:30,title:"The Diplomat's Grace",text:'The most powerful thing you can do in any conversation is make the other person feel genuinely understood. Not agreed with — understood.'},
    {lvl:50,title:'The Living Legend',   text:"You have become someone that other people's stories include. Not as a background character — as a turning point."},
  ],
};
const IDENTITY_TRAITS = [
  {minLvl:1,  trait:'Someone who shows up'},
  {minLvl:5,  trait:"Someone who doesn't quit when it gets hard"},
  {minLvl:10, trait:'Someone whose habits define them'},
  {minLvl:20, trait:'Someone others notice has changed'},
  {minLvl:30, trait:'Someone who has conquered their excuses'},
  {minLvl:50, trait:'Someone who trains because quitting would feel like betrayal'},
  {minLvl:75, trait:'Someone who has become the person they once admired'},
];
const TIER_COLORS = ['#38bdf8','#38bdf8','#818cf8','#a78bfa','#f0abfc'];
const TIER_LABELS = ['Awakened','Ascending','Transcendent','Sovereign','Absolute'];
const BAD_HABITS  = ['Doomscrolling','Junk Food','Skipping Sleep','Procrastinating','Excessive Gaming','Smoking','Oversleeping'];
const EXAMPLES    = ['Ran 5km even though I really didn\'t want to','Spent 90 minutes studying — finally clicked','Had a tough conversation and held my ground','Meditated 20 min after a brutal day','Read 40 pages before bed','30 mins deep work, no phone, fully focused'];

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const getTrait  = lvl => { let t=IDENTITY_TRAITS[0].trait; for(const x of IDENTITY_TRAITS){ if(lvl>=x.minLvl) t=x.trait; } return t; };
const getRank   = (arch,lvl) => { const r=RANKS[arch]||RANKS.warrior; let t=r[0][1]; for(const [l,n] of r){ if(lvl>=l) t=n; } return t; };
const getTier   = lvl => lvl>=50?4:lvl>=20?3:lvl>=10?2:lvl>=5?1:0;
const xpForLvl  = l => Math.round(100*Math.pow(1.1,l-1));
const resolveXP = xp => { let lvl=1,spent=0; while(true){ const n=xpForLvl(lvl); if(spent+n>xp) break; spent+=n; lvl++; } return {level:lvl,currentXP:xp-spent,neededXP:xpForLvl(lvl)}; };
const todayStr  = () => new Date().toDateString();
const daysAgoStr= d => d===0?'today':d===1?'yesterday':`${d} days ago`;
const getWeekStart = () => { const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); return d.toISOString(); };
const pct       = (v,max) => Math.min(100, max>0?(v/max)*100:0);

function pickWQ(goalAttr, primary){
  const pref=WQ_POOL.filter(q=>q.attr===goalAttr||primary.includes(q.attr));
  const rest=WQ_POOL.filter(q=>!pref.includes(q));
  const out=[]; const used=new Set();
  for(const q of [...pref,...rest]){ if(out.length===3) break; if(!used.has(q.id)){ out.push({...q,progress:0,done:false}); used.add(q.id); } }
  return out;
}

// ─── DECAY ───────────────────────────────────────────────────────────────────
function applyDecay(state){
  const now=Date.now(); const report=[];
  const attrs={...state.attrs};
  const peaks={...(state.attrPeaks||{})};
  const floors={...(state.attrFloors||{})};
  ATTRS.forEach(a=>{
    const cur=attrs[a.key]||0;
    if(!peaks[a.key]||cur>peaks[a.key]) peaks[a.key]=cur;
    floors[a.key]=Math.floor((peaks[a.key]||0)*0.8);
    const lastMs=state.lastTrained?.[a.key]?new Date(state.lastTrained[a.key]).getTime():null;
    if(!lastMs||cur<=0) return;
    const days=Math.floor((now-lastMs)/86400000);
    if(days<=2) return;
    const cons=(state.attrConsistency||{})[a.key]||0;
    const cf=1/(1+cons/30);
    const rate=(days<=6?0.003:days<=13?0.006:0.010)*cf;
    const lost=Math.floor(cur*Math.min(0.20,rate*(days-2)));
    const nv=Math.max(floors[a.key],cur-lost);
    const actual=cur-nv;
    if(actual>0){ attrs[a.key]=nv; report.push({attr:a.key,days,lost:actual,color:a.color,icon:a.icon,label:a.label,atFloor:nv<=floors[a.key]}); }
  });
  const newTotal=Object.values(attrs).reduce((s,v)=>s+v,0);
  return {newState:{...state,attrs,totalXP:newTotal,attrPeaks:peaks,attrFloors:floors},report};
}
function recordTraining(state,attrKey){
  const now=new Date().toISOString();
  const lastMs=state.lastTrained?.[attrKey]?new Date(state.lastTrained[attrKey]).getTime():null;
  const days=lastMs?Math.floor((Date.now()-lastMs)/86400000):999;
  const prev=(state.attrConsistency||{})[attrKey]||0;
  const cons=days<=1?prev+1:1;
  return {
    lastTrained:{...(state.lastTrained||{}),[attrKey]:now},
    attrConsistency:{...(state.attrConsistency||{}),[attrKey]:cons},
    inRecovery:days>=3&&days<=14,
    recoveryBonus:days>=3&&days<=14?1.3:1,
    kaizenStacks:Math.min(5,Math.floor(cons/30)),
    kaizenBonus:1+Math.min(5,Math.floor(cons/30))*0.05,
  };
}
function updateLegacy(leg={},entry,state,lvl){
  const u={...leg};
  if(!u.highestXP||entry.xp>u.highestXP.xp) u.highestXP={xp:entry.xp,label:entry.label,ts:entry.ts};
  if(entry.reason&&(!u.mostMeaningful||entry.xp>u.mostMeaningful.xp)) u.mostMeaningful={xp:entry.xp,label:entry.label,reason:entry.reason,ts:entry.ts};
  if(!u.longestStreak||state.streak>u.longestStreak) u.longestStreak=state.streak;
  if(!u.peakLevel||lvl>u.peakLevel) u.peakLevel=lvl;
  u.totalQuests=(u.totalQuests||0)+1;
  u.totalMinutes=(u.totalMinutes||0)+(entry.duration||0);
  const top=Object.entries(state.attrs).sort((a,b)=>b[1]-a[1]);
  if(top.length) u.dominantAttr=top[0][0];
  if(!u.firstQuestDate) u.firstQuestDate=entry.ts;
  return u;
}

// ─── AI ASSESS ───────────────────────────────────────────────────────────────
async function assessActivity(desc,name,archetype,goal,level){
  const arch=ARCHETYPES.find(a=>a.key===archetype);
  const g=GOALS.find(x=>x.key===goal);
  const prompt=`You are the AI core of "The System". Assess this activity and return JSON only.
PLAYER: ${name} | Archetype: ${arch?.label} | Goal: ${g?.label} | Level: ${level}
ACTIVITY: "${desc}"
Rules:
1. attribute: ONE of: strength, intelligence, charisma, willpower, agility
2. duration_minutes: extract from text; vague=20, default=30
3. intensity: 0.8-2.0 (easy=0.8, pushed limits=1.4, breakthrough=2.0)
4. meaningfulness: 0.7-1.5 (vague=0.7, solid=1.0, overcame resistance=1.4, milestone=1.5)
5. reason: max 12 words, punchy, address ${name} directly
6. label: 2-5 words Title Case
JSON only: {"attribute":"...","duration_minutes":0,"intensity":0.0,"meaningfulness":0.0,"reason":"...","label":"..."}`;
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:300,messages:[{role:'user',content:prompt}]})});
  const data=await res.json();
  const text=data.content?.find(b=>b.type==='text')?.text||'{}';
  return JSON.parse(text.replace(/```json|```/g,'').trim());
}

function attrStatus(key){

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
async function runAssess(){
  const desc=document.getElementById('quest-desc')?.value?.trim();
  if(!desc) return;
  const{level}=resolveXP(gs.totalXP);
  aiState='thinking'; renderApp();
  try{
    const a=await assessActivity(desc,gs.name,gs.archetype,gs.goal,level);
    const arch=ARCHETYPES.find(x=>x.key===gs.archetype)||ARCHETYPES[0];
    const gb=GOALS.find(g=>g.key===gs.goal)?.attr===a.attribute?1.15:1;
    const ab=arch.primary.includes(a.attribute)?1.1:1;
    const tr=recordTraining(gs,a.attribute);
    a.finalXP=Math.max(1,Math.round((a.duration_minutes*a.intensity*a.meaningfulness*gb*ab*tr.recoveryBonus*tr.kaizenBonus)/(level/5)));
    a._tr=tr; a._gb=gb>1; a._ab=ab>1; a._desc=desc;
    pendingAssessment=a; aiState='result'; renderApp();
  }catch(e){ aiState='error'; renderApp(); }
}

function confirmLog(){
  if(!pendingAssessment) return;
  const a=pendingAssessment;
  const{level:prevLvl}=resolveXP(gs.totalXP);
  // streak
  const today=todayStr();
  if(gs.lastLogDate!==today){
    const yest=new Date(); yest.setDate(yest.getDate()-1);
    gs.streak=gs.lastLogDate===yest.toDateString()?gs.streak+1:1;
    gs.lastLogDate=today;
  }
  // week reset
  const now=getWeekStart();
  if(gs.weekStart!==now){
    const arch=ARCHETYPES.find(x=>x.key===gs.archetype)||ARCHETYPES[0];
    gs.weekStart=now;
    gs.weeklyQuests=pickWQ(GOALS.find(g=>g.key===gs.goal)?.attr,arch.primary);
  }
  // training metadata
  gs.lastTrained=a._tr.lastTrained;
  gs.attrConsistency=a._tr.attrConsistency;
  // XP
  gs.totalXP=Math.max(0,gs.totalXP+a.finalXP);
  gs.attrs[a.attribute]=Math.max(0,(gs.attrs[a.attribute]||0)+a.finalXP);
  // peaks / floors
  if(!gs.attrPeaks[a.attribute]||gs.attrs[a.attribute]>gs.attrPeaks[a.attribute]) gs.attrPeaks[a.attribute]=gs.attrs[a.attribute];
  gs.attrFloors[a.attribute]=Math.floor(gs.attrPeaks[a.attribute]*0.8);
  // weekly quests
  gs.weeklyQuests=(gs.weeklyQuests||[]).map(q=>{
    if(q.done) return q;
    let p=q.progress;
    if(q.type==='count'&&q.cat===a.attribute) p=Math.min(q.target,p+1);
    if(q.type==='duration'&&q.cat===a.attribute) p=Math.min(q.target,p+a.duration_minutes);
    if(p>=q.target&&!q.done){ gs.totalXP+=200; gs.attrs[a.attribute]=(gs.attrs[a.attribute]||0)+200; }
    return{...q,progress:p,done:p>=q.target};
  });
  // milestones
  const{level:ovLvl}=resolveXP(gs.totalXP);
  gs.milestones=(gs.milestones||[]).map(m=>{
    if(m.done) return m;
    let p=m.progress;
    if(m.type==='count'&&m.attr===a.attribute) p=Math.min(m.target,p+1);
    if(m.type==='duration'&&m.attr===a.attribute) p=Math.min(m.target,p+a.duration_minutes);
    if(m.type==='streak') p=Math.max(p,gs.streak);
    if(m.type==='level') p=Math.max(p,ovLvl);
    if(m.type==='attrlevel'){ const{level:al}=resolveXP(gs.attrs[m.attr]||0); p=Math.max(p,al); }
    const done=p>=m.target;
    if(done&&!m.done){ gs.totalXP+=m.xp; gs.attrs[a.attribute]=(gs.attrs[a.attribute]||0)+m.xp; }
    return{...m,progress:p,done};
  });
  // legacy
  gs.legacy=updateLegacy(gs.legacy,{...a,duration:a.duration_minutes,xp:a.finalXP,label:a.label,ts:new Date().toLocaleString()},gs,resolveXP(gs.totalXP).level);
  // lore unlock
  const newLvl=resolveXP(gs.totalXP).level;
  const lore=LORE[gs.archetype]||LORE.warrior;
  const nc=lore.find(c=>newLvl>=c.lvl&&prevLvl<c.lvl);
  if(nc) setTimeout(()=>showFlash(`✦ Chapter unlocked: "${nc.title}"`, 'fl'), 2700);
  // log entry
  gs.log=[{id:Date.now(),label:a.label||a._desc?.slice(0,40),xp:a.finalXP,attr:a.attribute,reason:a.reason,ts:new Date().toLocaleString(),recovery:a._tr.inRecovery,kaizen:a._tr.kaizenStacks>0},...(gs.log||[])].slice(0,60);
  saveState();
  // flash
  if(newLvl>prevLvl) showFlash(`LEVEL UP · ${getRank(gs.archetype,newLvl)} · LV ${newLvl}`, 'flv');
  else {
    let msg=`+${a.finalXP} XP · ${a.label}`;
    if(a._tr.inRecovery) msg+=' · 🔄 +30%';
    if(a._tr.kaizenStacks>0) msg+=` · ◆ ×${a._tr.kaizenStacks}`;
    showFlash(msg, 'fp');
  }
  pendingAssessment=null; aiState='idle';
  currentTab='dashboard'; renderApp();
}

function applyPenalty(habit){
  const{level}=resolveXP(gs.totalXP);
  const pen=Math.round(xpForLvl(level)*0.18);
  gs.totalXP=Math.max(0,gs.totalXP-pen);
  gs.attrs.willpower=Math.max(0,(gs.attrs.willpower||0)-pen);
  gs.log=[{id:Date.now(),label:`Penalty: ${habit}`,xp:-pen,attr:'willpower',reason:'Habit tax collected.',ts:new Date().toLocaleString()},...(gs.log||[])].slice(0,60);
  saveState(); showFlash(`-${pen} XP · ${habit} Penalty`, 'fn'); renderApp();
}

    <input class="sl-input" id="ob-mantra" placeholder="I am becoming someone who earns their rest." value="${obData.mantra}" style="margin-bottom:7px">
    <div style="font-size:11px;color:rgba(56,189,248,0.3);margin-bottom:18px">Leave blank for default.</div>
    <button class="btn-p" onclick="finishOnboarding()">Begin My Journey</button>`;
  }
}
function toggleHabit(h){
  obData.habits=obData.habits||[];
  obData.habits=obData.habits.includes(h)?obData.habits.filter(x=>x!==h):[...obData.habits,h];
  renderOnboarding();
}
function finishOnboarding(){
  const mantraEl=document.getElementById('ob-mantra');
  const mantra=mantraEl?.value?.trim()||`I am becoming the best version of ${obData.name}.`;
  const arch=ARCHETYPES.find(a=>a.key===obData.archetype)||ARCHETYPES[0];
  const goalAttr=GOALS.find(g=>g.key===obData.goal)?.attr;
  gs={...DEF,name:obData.name,manifesto:mantra,archetype:obData.archetype,goal:obData.goal,badHabits:obData.habits||[],onboarded:true,weeklyQuests:pickWQ(goalAttr,arch.primary),milestones:buildMilestones(obData.goal),weekStart:getWeekStart()};
  saveState();
  document.getElementById('screen-onboard').style.display='none';
  document.getElementById('screen-app').style.display='block';
  currentTab='dashboard'; renderApp();
}

// ─── BOOT ────────────────────────────────────────────────────────────────────
function boot(){
  loadState();
  if(gs.onboarded){
    // apply decay on launch
    try{
      const{newState,report}=applyDecay(gs);
      gs=newState; decayReport=report; showDecay=report.length>0;
      saveState();
    }catch(e){}
    document.getElementById('screen-onboard').style.display='none';
    document.getElementById('screen-app').style.display='block';
    currentTab='dashboard'; renderApp();
  } else {
    renderOnboarding();
  }
}
boot();
</script>
</body>
</html>
